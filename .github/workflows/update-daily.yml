name: Daily BTC Price Update

on:
  schedule:
    # Run every day at 01:05 UTC (give the seed job some buffer)
    - cron: "5 1 * * *"
  workflow_dispatch:

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymongo[srv] python-dotenv pandas ta skyfield requests

      - name: Run daily update
        env:
          MONGODB_URI:       ${{ secrets.MONGODB_URI }}
          KUCOIN_API_KEY:    ${{ secrets.KUCOIN_API_KEY }}
          KUCOIN_API_SECRET: ${{ secrets.KUCOIN_API_SECRET }}
        run: |
          python btc_tracker_mongodb/update_daily.py
