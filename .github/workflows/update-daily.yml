name: Daily Price Update (All Tokens)

on:
  workflow_dispatch:
  # Schedule disabled — now runs via local launchd on Mac Mini (com.eeva.tracker-daily)
  # Was: cron: "5 1 * * *"
  # Manual fallback: trigger from GitHub UI. Writes to Atlas (MONGODB_URI secret).

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update for all tokens (spot)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python update.py --all --timeframe 1d

      - name: Run daily update for all tokens (perp)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python update.py --all --timeframe 1d --market-type perp

      - name: Run weekly update for all tokens (spot)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python update.py --all --timeframe 1w
