name: Hourly BTC Price Update (Spot + Perp)

on:
  workflow_dispatch:
  # Schedule disabled — now runs via local launchd on Mac Mini (com.eeva.tracker-hourly)
  # Was: cron: "5 * * * *"
  # Manual fallback: trigger from GitHub UI. Writes to Atlas (MONGODB_URI secret).

jobs:
  update-hourly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run hourly update for BTC (spot)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python update.py --symbol BTC-USDT --timeframe 1h

      - name: Run hourly update for BTC (perp)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python update.py --symbol BTC-USDT --timeframe 1h --market-type perp
